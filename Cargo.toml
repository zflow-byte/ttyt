[workspace]
resolver = "2"
members = [
    "crates/ttyt-core",
    "crates/ttyt-ui",
    "crates/ttyt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ttyt-core = { path = "crates/ttyt-core" }
ttyt-ui = { path = "crates/ttyt-ui" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
serialport = "4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
anyhow = "1"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
directories = "5"
unicode-width = "0.2"

[profile.release]
lto = true
